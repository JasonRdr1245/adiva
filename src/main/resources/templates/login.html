<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Login</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #ff7e5f, #feb47b);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: white;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        position: relative;
      }

      h2 {
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 40px;
        color: #262626;
      }

      label {
        display: block;
        text-align: left;
        margin: 15px 0 5px;
        font-weight: bold;
        color: #333;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background-color: #0095f6;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s;
      }

      button:hover {
        background-color: #0078d4;
      }

      button:active {
        transform: scale(0.98);
      }

      button:focus {
        outline: none;
      }

      .register-link {
        margin-top: 20px;
        font-size: 14px;
      }

      .register-link a {
        color: #0095f6;
        text-decoration: none;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      .error {
        background-color: #ffe0e0;
        color: #d8000c;
        border: 1px solid #d8000c;
        padding: 15px;
        margin-top: 20px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>
      <form th:action="@{/login}" method="post">
        <label for="email">Correo Electrónico:</label>
        <input type="email" name="email" id="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" required />

        <button type="submit">Iniciar Sesión</button>
      </form>
      <div class="register-link">
        <p>¿No estás registrado? <a href="/register">Regístrate aquí</a></p>
      </div>

      <!-- Cuadro de error -->
      <div th:if="${loginError}" class="error">
        <p th:text="${loginError}"></p>
      </div>
      <div th:if="${param.accountDeleted}" class="alert alert-success">
        Cuenta eliminada exitosamente
      </div>
    </div>
  </body>
</html>
